# 99-5g-performance.conf
# High-Performance Kernel Network Buffer & SDR Tuning for Private 5G

# Enable IP Forwarding
net.ipv4.ip_forward = 1

# Maximum and Default Socket Buffers for UHD and High-Throughput GTP-U (64MB max, 32MB default)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432

# Network Device Queue Backlog and Socket Listen Limits
net.core.netdev_max_backlog = 10000
net.core.somaxconn = 8192

# TCP Memory Auto-tuning (Min, Default, Max - up to 32MB window)
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# BBR Congestion Control if available
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
