# Open5GS UPF Configuration for MEC / Critical Slice (upf2-ns)
logger:
  file:
    path: /var/log/open5gs/upf_mec.log
  level: info

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - address: 10.200.4.2
    client:
      smf:
        - address: 10.200.1.1

  gtpu:
    server:
      - address: 10.200.4.2

  session:
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dnn: critical
      dev: ogstun
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dnn: mec-secure
      dev: ogstun
    - subnet: 10.47.0.0/16
      gateway: 10.47.0.1
      dnn: iot
      dev: ogstun2

  metrics:
    server:
      - address: 10.200.4.2
        port: 9090
