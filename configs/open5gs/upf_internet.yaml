# Open5GS UPF Configuration for Internet Slice (upf1-ns)
logger:
  file:
    path: /var/log/open5gs/upf_internet.log
  level: info

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - address: 10.200.3.2
    client:
      smf:
        - address: 10.200.1.1

  gtpu:
    server:
      - address: 10.200.3.2

  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
      dev: ogstun

  metrics:
    server:
      - address: 10.200.3.2
        port: 9090
